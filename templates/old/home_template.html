<!DOCTYPE html>
<html lang="en">
  <head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<!--<title>FastAPI Blog Tutorial</title>-->
	<!-- use a template variable to set the title -->
	<title>
		{% if title %}
			FastAPI Blog Tutorial - {{ title }}
		{% else %}
			FastAPI Blog Tutorial - No Title
		{% endif %}
	</title>
  </head>
  <body>
	<h1>Home Page</h1>
	<!--<p>This is using a template!</p>-->
	<!-- template loop - posts comes from the context - access keys using dot notation -->
	{% for post in posts %}
		<h2>{{ post.title }}</h2>
		<p>{{ post.content }}</p>
		<p>by {{ post.author }} on {{ post.date_posted }}</p>
	{% endfor %}
  </body>
</html>
