<!DOCTYPE html>
<html lang="en">
  <head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<!-- use a template variable to set the title -->
	<title>
		{% if title %}
			FastAPI Blog Tutorial - {{ title }}
		{% else %}
			FastAPI Blog Tutorial - No Title
		{% endif %}
	</title>
  </head>
  <body>
	<!-- define block for child templates to fill in -->
	{% block content %}
	{% endblock content%}
  </body>
</html>
